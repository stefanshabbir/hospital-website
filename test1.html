<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>

        <label for="paymentMethod">Select Payment Method</label>
  <select id="paymentMethod">
    <option value="card">Pay By Card</option>
    <option value="cash">Cash On Delivery</option>
  </select>

  <!-- Hidden input for toggling tabs -->
  <div class="payment-options">
    <input type="radio" id="cardPayment" name="paymentOption" class="hidden-input" checked>
    <input type="radio" id="cashPayment" name="paymentOption" class="hidden-input">

    <!-- Pay By Card Section -->
    <div class="tab" data-value="card">
      <label for="cardPayment" class="tab-label">Pay By Card</label>
      <label for="cname">Name on Card</label>
      <input type="text" id="cname" name="cardname" placeholder="John More Doe">
      <label for="ccnum">Credit card number</label>
      <input type="text" id="ccnum" name="cardnumber" placeholder="1111-2222-3333-4444">
      <label for="expmonth">Exp Month</label>
      <input type="text" id="expmonth" name="expmonth" placeholder="September">
      <div class="payment-row">
        <div class="col-50 exp-year">
          <label for="expyear">Exp Year</label>
          <input type="text" id="expyear" name="expyear" placeholder="2025">
        </div>
        <div class="col-50 cvv">
          <label for="cvv">CVV</label>
          <input type="text" id="cvv" name="cvv" placeholder="123">
        </div>
      </div>
    </div>

    <!-- Cash On Delivery Section -->
    <div class="tab" data-value="cash">
      <label for="cashPayment" class="tab-label">Cash On Delivery</label>
      <p>Cash on Delivery selected. Please confirm your shipping address.</p>
    </div>
  </div>
</div>

<style>
  /* Hide the radio buttons */
  .hidden-input {
    display: none;
  }

  /* Style the tabs */
  .tab {
    display: none;
  }

  /* Show tab based on the selected radio button */
  #cardPayment:checked ~ .tab[data-value="card"],
  #cashPayment:checked ~ .tab[data-value="cash"] {
    display: block;
  }

  /* Optional: Improve the dropdown look */
  select {
    padding: 8px;
    font-size: 16px;
    margin-bottom: 20px;
  }
</style>
    </main>
    <script defer>
        let numInput = document.getElementById("numInput");
        let result = document.getElementById("result");
        
        numChecker = (num) => {
            if (parseInt(numInput.value) % 2 === 0) {
                result.textContent = "Even"
            } else {
                result.textContent = "Odd"
            }
        }

        dayChecker = (day) => {
            lDay = day.toLowerCase();
            return (lDay.charAt(0).toUpperCase() + lDay.slice(1));
        }

        let submitBtn1 = document.getElementById("submitBtn");
        submitBtn1.addEventListener("click", () => {
            let numInput1 = document.getElementById("numInput1");
            let numInput2 = document.getElementById("numInput2");
            const vol = Math.PI * Math.pow(numInput1.value, 2) * numInput2.value;
            result.textContent = vol.toFixed(2);
        });
        submitBtn.addEventListener("click", () => {
            const day = dayChecker(numInput.value);

            switch (day) {
                case "Monday":
                    result.innerText = "Monday";
                    break;
                case "Tuesday":
                    result.innerText = "Tuesday";
                    break;
                case "Wednesday":
                    result.innerText = "Wednesday";
                    break;
                case "Thursday":
                    result.innerText = "Thursday";
                    break;
                case "Friday":
                    result.innerText = "Friday";
                    break;
                case "Saturday":
                    result.innerText = "Saturday";
                    break;
                case "Sunday":
                    result.innerText = "Sunday";
                    break;
                default:
                    result.innerText = "Error: Put a day"
                    break;
            }

        
        });
    </script>
</body>
</html>
