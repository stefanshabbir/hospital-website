<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./Styles/test.css">
    <link rel="stylesheet" href="./Styles/components.css">
    <link rel="stylesheet" href="./Styles/checkout.css">
</head>
<body>
    <main>
      <div class="payment-row">
        <div class="col-25">
          <div class="container cart">
            <h4>Cart
              <span class="price" style="color:black">
                <b id="totalCartQuantity"></b>
              </span>
            </h4>
            <div class="cart-display-container"></div>
          </div>
          <button id="favoriteCart" class="btn">Remember Cart?</button>
        </div>
      
        <div class="col-75">
          <div class="container">
            <form>
              <!-- Shipping Address Section -->
              <div class="payment-row">
                <div class="col-50">
                  <h3>Shipping Address</h3>
                  <label for="fname">Full Name</label>
                  <input type="text" id="fname" name="firstname" placeholder="John M. Doe" required pattern="[A-Za-z\s]+" title="Full name should contain only letters and spaces">
      
                  <label for="email">Email</label>
                  <input type="email" id="email" name="email" placeholder="john@example.com" required>
      
                  <label for="adr">Address</label>
                  <input type="text" id="adr" name="address" placeholder="542 W. 15th Street" required>
      
                  <label for="city">City</label>
                  <input type="text" id="city" name="city" placeholder="Colombo" required>
      
                  <div class="payment-row">
                    <div class="col-50 province">
                      <label for="province">Province</label>
                      <input type="text" id="province" name="province" placeholder="Western">
                    </div>
                    <div class="col-50 zip">
                      <label for="zip">Zip</label>
                      <input type="text" id="zip" name="zip" placeholder="10001" pattern="\d{5}">
                    </div>
                  </div>
                </div>
      
                <!-- Payment Section -->
                <div class="col-50">
                  <h3>Payment</h3>
                  <label for="paymentMethod">Select Payment Method</label>
                  <select id="paymentMethod" name="paymentMethod" required class="input-field">
                    <option value="">--Select Payment Method--</option>
                    <option value="card">Pay By Card</option>
                    <option value="cash">Cash On Delivery</option>
                  </select>
      
                  <!-- Pay By Card Section -->
                  <div id="cardPaymentSection" style="display: none;">
                    <label for="cname">Name on Card</label>
                    <input type="text" id="cname" name="cardname" placeholder="John More Doe" pattern="[A-Za-z\s]+" title="Full name should contain only letters and spaces">
      
                    <label for="ccnum">Card number</label>
                    <input type="text" id="ccnum" name="cardnumber" placeholder="1111-2222-3333-4444" pattern="\d{16}" title="Card number must be 16 digits">
      
                    <div class="payment-row">
                      <div class="col-50 exp-year">
                        <label for="expyear">Exp Year</label>
                        <input type="text" id="expyear" name="expyear" placeholder="2025" pattern="\d{4}" title="Expiration year must be 4 digits">
                      </div>
                      <div class="col-50 exp-month">
                        <label for="expmonth">Exp Month</label>
                        <input type="text" id="expmonth" name="expmonth" placeholder="September">
                      </div>
                    </div>
      
                    <label for="cvv">CVV</label>
                    <input type="text" id="cvv" name="cvv" placeholder="352" pattern="\d{3}" title="CVV must be 3 digits">
                  </div>
      
                  <!-- Cash On Delivery Section -->
                  <div id="cashPaymentSection" style="display: none;">
                    <p>You selected <strong>Cash On Delivery</strong>. Please confirm your address for delivery.</p>
                  </div>
                </div>
              </div>
      
              <label for="sameadrr" class="sameaddr-checkbox">
                <input type="checkbox" checked="checked" id="sameadrr" name="sameadrr"> Shipping address same as billing
              </label>
              <input type="submit" value="Pay" class="btn checkout">
            </form>
          </div>
        </div>
      </div>      
    </main>
    <script src="./Scripts/script.js" defer></script>
    <script src="./Scripts/auth.js" defer></script>
</body>
</html>
