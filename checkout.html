<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="test.css">
    <link rel="stylesheet" href="./Styles/components.css">
    <link rel="stylesheet" href="./Styles/checkout.css">
</head>
<body>
    <main>
        <div class="payment-row">
            <div class="col-75">
              <div class="container">
                <form>
          
                  <div class="payment-row">
                    <div class="col-50">
                      <h3>Billing Address</h3>
                      <label for="fname">Full Name</label>
                      <input type="text" id="fname" name="firstname" placeholder="John M. Doe">
                      <label for="email">Email</label>
                      <input type="text" id="email" name="email" placeholder="john@example.com">
                      <label for="adr">Address</label>
                      <input type="text" id="adr" name="address" placeholder="542 W. 15th Street">
                      <label for="city">City</label>
                      <input type="text" id="city" name="city" placeholder="Colombo">
          
                      <div class="payment-row">
                        <div class="col-50">
                          <label for="state">Province</label>
                          <input type="text" id="state" name="state" placeholder="Western">
                        </div>
                        <div class="col-50">
                          <label for="zip">Zip</label>
                          <input type="text" id="zip" name="zip" placeholder="10001">
                        </div>
                      </div>
                    </div>
          
                    <div class="col-50">
                      <h3>Payment</h3>
                      <div class="tab-container">
                        <input type="radio" id="cardPayment" name="tab-container">
                        <label for="cardPayment" class="tab-button">Pay By Card</label>
                        <div class="tab"> 
                          <label for="cname">Name on Card</label>
                          <input type="text" id="cname" name="cardname" placeholder="John More Doe">
                          <label for="ccnum">Credit card number</label>
                          <input type="text" id="ccnum" name="cardnumber" placeholder="1111-2222-3333-4444">
                          <label for="expmonth">Exp Month</label>
                          <input type="text" id="expmonth" name="expmonth" placeholder="September">
              
                          <div class="payment-row">
                            <div class="col-50">
                              <label for="expyear">Exp Year</label>
                              <input type="text" id="expyear" name="expyear" placeholder="2018">
                            </div>
                            <div class="col-50">
                              <label for="cvv">CVV</label>
                              <input type="text" id="cvv" name="cvv" placeholder="352">
                            </div>
                          </div>
                        </div>
                        
                        <input type="radio" id="cashPayment" name="tab-container">
                        <label for="cashPayment" class="tab-button">Cash On Delivery</label>
                        <div class="tab"> 
                          hello
                        </div> 
                      </div>
                    </div>
          
                  </div>
                  <label>
                    <input type="checkbox" checked="checked" name="sameadr"> Shipping address same as billing
                  </label>
                  <input type="submit" value="Checkout" class="btn">
                </form>
              </div>
            </div>
          
            <div class="col-25">
              <div class="container">
                <h4>Cart
                  <span class="price" style="color:black">
                    <b id="totalCartQuantity"></b>
                  </span>
                </h4>
                <div class="cart-display-container"></div>
              </div>
              <button id="favoriteCart">Remember Cart?</button>
            </div>
          </div>
    </main>
    <script src="./Scripts/script.js" defer></script>
    <script src="./Scripts/auth.js" defer></script>
</body>
</html>
